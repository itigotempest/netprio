name: Build and Release NetPrio

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Framework-Dependent (x64)
        run: |
          dotnet publish NetPrio.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained false -o ./publish-fdd

      - name: Publish Self-Contained (x64)
        run: |
          dotnet publish NetPrio.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o ./publish-sc

      - name: Package release archives & read commit info
        shell: pwsh
        run: |
          $dateTag = Get-Date -Format "yyyy.MM.dd"
          $version = "v$dateTag-${{ github.run_number }}"
          $shortSha = git rev-parse --short HEAD
          $commitMsg = git log -1 --pretty=%B

          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$version" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "COMMIT_SHA=$shortSha" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "COMMIT_MSG<<EOF" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value $commitMsg -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "EOF" -Encoding utf8

          Compress-Archive -Path ./publish-fdd/* -DestinationPath "./NetPrio-$version-win-x64.zip" -Force
          Compress-Archive -Path ./publish-sc/* -DestinationPath "./NetPrio-$version-win-x64-self-contained.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "NetPrio ${{ env.RELEASE_TAG }}"
          body: |
            Automated build for `${{ env.RELEASE_TAG }}` (commit `${{ env.COMMIT_SHA }}`).

            ### Changes
            ```text
            ${{ env.COMMIT_MSG }}
            ```

            **Requirements:**
            - **Windows 11 (x64)** strictly (build 22000+)
            - Administrator privileges (for WinDivert)

            **Which archive to download:**
            - `NetPrio-*-win-x64.zip` — smaller build (requires **.NET 10 Desktop Runtime (x64)**)
            - `NetPrio-*-win-x64-self-contained.zip` — standalone build (includes .NET runtime, no extra installs needed)

            `WinDivert.dll` and `WinDivert64.sys` are included in both archives.
          files: ./NetPrio-*.zip