name: Build and Release NetPrio (Rust)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release (x64)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package release archive & read commit info
        shell: pwsh
        run: |
          $dateTag = Get-Date -Format "yyyy.MM.dd"
          $version = "v$dateTag-${{ github.run_number }}"
          $shortSha = git rev-parse --short HEAD
          $commitMsg = git log -1 --pretty=%B

          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$version" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "COMMIT_SHA=$shortSha" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "COMMIT_MSG<<EOF" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value $commitMsg -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "EOF" -Encoding utf8

          New-Item -ItemType Directory -Force -Path ./dist | Out-Null
          Copy-Item ./target/x86_64-pc-windows-msvc/release/netprio.exe ./dist/
          Copy-Item ./WinDivert.dll ./dist/
          Copy-Item ./WinDivert64.sys ./dist/
          Compress-Archive -Path ./dist/* -DestinationPath "./NetPrio-$version-win-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "NetPrio ${{ env.RELEASE_TAG }}"
          body: |
            Automated Rust build for `${{ env.RELEASE_TAG }}` (commit `${{ env.COMMIT_SHA }}`).

            ### Changes
            ```text
            ${{ env.COMMIT_MSG }}
            ```

            **Requirements:**
            - **Windows 11 (x64)** with Administrator privileges (for WinDivert)
            - Zero runtime dependencies (single standalone `netprio.exe`)
          files: ./NetPrio-*.zip
